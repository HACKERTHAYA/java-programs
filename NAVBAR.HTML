<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Navbar</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 5Px;
            padding: 5Px;
        }
        .navbar {
            background-color: #7a91db;
            overflow: hidden;
        }
        .navbar a {
            float: left;
            
            color: #1d0e74;
            text-align: right;
            padding: 14px 20px;
            text-decoration: none;
        }
        .navbar a:hover {
            background-color: #1d2f97;
            color: rgb(0, 0, 0);
        }
    </style>
</head>
<body>

<div class="navbar">
    <a href="#home">Home</a>
    <a href="#services">Services</a>
    <a href="#about">About</a>
    <a href="#contact">Contact</a>
</div>

</body>
</html>

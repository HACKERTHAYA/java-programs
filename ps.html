<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo class</title>
    <style>
        
        a:link{
            color: blueviolet;
        }
        
        a:active{
            color: black;
        }
        h1.highlight:hover{
            color: aqua;
            font-size: 50px;
        }
    </style>
</head>

<body>
    <p><a href="https://www.flipkart.com/">this is flipkart kink</a></p>
    <h1 class="highlight">hi</h1>
</body>
</html>
